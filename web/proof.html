<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof · suture</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/suture.css">
<!-- Owner: slice D. Vanilla HTML + fetch + inline SVG, no build step. Served at /proof/<campaign_id>. Design: DESIGN.md. -->
<style>
  .shell { max-width: 1320px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 24px; }
  @media (max-width: 760px) { .shell { padding: 0 12px 40px; } main { gap: 16px; padding-top: 16px; } .topbar { margin-top: 12px; } .topbar .tagline, #cid { display: none; }
    #summary .stat b { font-size: 24px; } #summary .verdict .big { font-size: 26px; } }

  #summary > .glass-content { display: flex; flex-direction: column; gap: 28px; padding: 32px 32px 28px; }
  #summary .verdict { padding: 6px 0 6px 18px; }
  #summary .verdict .big { font-size: 40px; line-height: 1.1; letter-spacing: -.015em; }
  #summary .verdict .why { font-size: 15px; margin-top: 10px; max-width: 70ch; }
  #summary .stats { border-top: 1px solid var(--hairline); padding-top: 22px; row-gap: 18px; }
  #summary .stat { text-align: left; padding: 0 32px; }
  #summary .stat:first-child { padding-left: 0; }

  #dag { padding: 24px 24px 28px; overflow-x: auto; }
  #dag svg { display: block; height: auto; }
  #dag .node { cursor: pointer; }
  #dag .node .card { fill: var(--forest); stroke: var(--hairline); stroke-width: 1; transition: fill var(--dur) var(--ease); }
  #dag .node:hover .card, #dag .node.focus .card { fill: var(--moss); }
  #dag .node.focus .card { stroke: var(--amber); }
  #dag .node .t1 { fill: var(--ink); font: 500 13px var(--font-text); }
  #dag .node .t2 { fill: var(--fog); font: 11px var(--font-mono); }
  #dag .node .t3 { font: 500 11.5px var(--font-text); }
  #dag .edge { fill: none; stroke: var(--hairline-strong); stroke-width: 1; }
  #dag .edge.hot { stroke: var(--amber); }

  .evidence { border-bottom: 1px solid var(--hairline); scroll-margin-top: 24px; transition: background-color var(--dur) var(--ease); }
  .evidence.focus { background: var(--amber-soft); }
  .evidence .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 24px 24px 10px; }
  .evidence .head .op { font-weight: 500; font-size: 15px; }
  .evidence .head .adapter { color: var(--fog); }
  .evidence .head .aid { margin-left: auto; color: var(--fog); }
  .evidence .seam { padding: 6px 24px 10px; }
  .evidence .body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  @media (max-width: 900px) { .evidence .body { grid-template-columns: minmax(0, 1fr); } }
  .evidence .colx { padding: 10px 24px 24px; min-width: 0; }
  .evidence .colx + .colx { border-left: 1px solid var(--hairline); }
  @media (max-width: 900px) { .evidence .colx + .colx { border-left: 0; border-top: 1px solid var(--hairline); } }
  .evidence h3 { margin: 14px 0 8px; font-size: 11px; line-height: 1.2; font-weight: 500; text-transform: uppercase; letter-spacing: .12em; color: var(--fog); }
  table.timeline { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
  table.timeline col.c-ts { width: 104px; } table.timeline col.c-move { width: 150px; } table.timeline col.c-dt { width: 76px; }
  table.timeline td { padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--hairline); }
  table.timeline tr:first-child td { border-top: 0; }
  table.timeline td.ts, table.timeline td.dt { color: var(--fog); white-space: nowrap; }
  table.timeline td.dt { text-align: right; }
  table.timeline td.reason { color: var(--sage); overflow-wrap: anywhere; }
  table.timeline .arrow { color: var(--fog); }
  pre { margin: 0; padding: 10px 12px; background: rgba(6,8,7,.55); border: 1px solid var(--hairline); border-radius: var(--r-sm); color: var(--sage);
    overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  @media (max-width: 760px) {
    table.timeline colgroup { display: none; }
    table.timeline, table.timeline tbody { display: block; }
    table.timeline tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0 10px; padding: 5px 0; border-top: 1px solid var(--hairline); }
    table.timeline tr:first-child { border-top: 0; }
    table.timeline td { padding: 0; border-top: 0; }
    table.timeline td.reason { grid-column: 1 / -1; }
  }
  .none { color: var(--fog); font-size: 13px; }
  .problems { margin: 0; padding-left: 18px; color: var(--state-failed); font-size: 13px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="shell">
<header class="glass topbar">
  <div class="glass-content">
    <a class="brand" href="/"><img src="/static/logo.svg" alt=""><span class="word">suture</span></a>
    <span class="crumb">/ proof</span>
    <span class="tagline" id="title"></span>
    <span class="spacer"></span>
    <span class="mono" id="cid" style="color: var(--fog)"></span>
    <a class="link" href="/">Dashboard</a>
  </div>
</header>

<main>
  <section class="glass panel" id="summary">
    <div class="glass-content">
      <div id="verdict" class="verdict wait"><span class="big">Loading.</span></div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section class="glass panel" id="dagPanel">
    <div class="glass-content">
      <div class="panel-head"><div><div class="kicker">Dependency graph</div><h2>How the steps connect</h2></div></div>
      <div id="dag" class="scroll"></div>
    </div>
  </section>

  <section class="glass panel" id="evidencePanel">
    <div class="glass-content">
      <div class="panel-head"><div><div class="kicker">Receipts</div><h2>Every transition, every check</h2></div><span class="count" id="evCount"></span></div>
      <div class="scroll" id="cards"></div>
    </div>
  </section>
</main>
</div>

<script src="/static/glass.js"></script>
<script>
const campaignId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
const STATES = ["intended", "sent", "receipt", "verified", "unknown", "failed"];
const TERMINAL = new Set(["verified", "failed"]);
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cls = (s) => (STATES.includes(s) ? s : "intended");
const stamp = (iso) => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleTimeString([], { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0"); };
const badge = (s, now) => `<span class="badge s-${cls(s)} ${now ? "now" : ""}">${esc(s)}</span>`;
const pretty = (v) => esc(JSON.stringify(v, null, 2));
const hasKeys = (v) => v && typeof v === "object" && Object.keys(v).length > 0;
const clip = (text, n) => (String(text).length > n ? String(text).slice(0, n - 1) + "…" : String(text));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const stateColor = (s) => cssVar(`--state-${cls(s)}`);
const recoveryStep = (t) => /reconcil|lookup|recover/i.test(t.reason || "");

// The node that matters right now: the first one still in flight, else the last one to move.
function currentNode(report) {
  const open = report.nodes.find((n) => !TERMINAL.has(n.state));
  if (open) return open.id;
  let best = null, at = "";
  for (const n of report.nodes) for (const t of n.timeline) if (t.ts && String(t.ts) > at) { at = String(t.ts); best = n.id; }
  return best;
}

function renderVerdict(report) {
  const s = report.summary;
  let klass = "wait", big = "", why = "";
  if (!s.actions) { big = "Nothing recorded yet."; why = "No actions have been created for this campaign."; }
  else if (!s.chains_intact) { klass = "bad"; big = "The ledger doesn't add up."; why = `${plural(s.broken_chains, "action")} took a path the state machine doesn't allow.`; }
  else if (s.by_state.failed) { klass = "bad"; big = `${plural(s.by_state.failed, "action")} failed.`; why = `Failed: ${report.nodes.filter((n) => n.state === "failed").map((n) => n.label).join(", ")}.`; }
  else if (s.all_verified) {
    klass = "ok"; big = `All ${s.actions} actions verified.`;
    why = `${s.transitions} fenced transitions, each a legal path${s.recovered ? `. ${plural(s.recovered, "action")} recovered after a crash, not re-sent` : ""}${s.adapted ? `. ${s.adapted} verified after a proposed mapping` : ""}.`;
  }
  else { big = `${s.verified} of ${s.actions} verified.`; why = `${s.open} still in progress. This page follows the ledger live.`; }
  $("verdict").className = `verdict ${klass}`;
  $("verdict").innerHTML = `<span class="big">${esc(big)}</span><span class="why">${esc(why)}</span>`;
}

function renderStats(report) {
  const s = report.summary;
  const span = s.first_transition_at && s.last_transition_at ? ((new Date(s.last_transition_at) - new Date(s.first_transition_at)) / 1000).toFixed(1) + "s" : "–";
  const cells = [[s.actions, "actions"], [s.verified, "verified"], [s.recovered, "recovered"], [s.adapted || 0, "adapted"], [s.transitions, "transitions"], [span, "elapsed"]];
  $("stats").innerHTML = cells.map(([n, label]) => `<div class="stat"><b>${esc(n)}</b><span>${label}</span></div>`).join("");
}

function renderDag(report, current) {
  const nodes = report.nodes;
  if (!nodes.length) { $("dag").innerHTML = `<div class="empty"><div class="t">No actions yet.</div></div>`; return; }
  const W = 210, H = 62, GX = 64, GY = 18, PAD = 4;
  const columns = [];
  for (const n of nodes) (columns[n.layer] = columns[n.layer] || []).push(n);
  const tallest = Math.max(...columns.map((c) => (c ? c.length : 0)));
  const height = PAD * 2 + tallest * H + (tallest - 1) * GY;
  const width = PAD * 2 + columns.length * W + (columns.length - 1) * GX;
  const pos = new Map();
  columns.forEach((col, x) => {
    const colHeight = col.length * H + (col.length - 1) * GY;
    col.forEach((n, y) => pos.set(n.id, { x: PAD + x * (W + GX), y: (height - colHeight) / 2 + y * (H + GY) }));
  });
  const edges = report.edges.filter((e) => pos.has(e.from) && pos.has(e.to)).map((e) => {
    const a = pos.get(e.from), b = pos.get(e.to);
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mid = (x1 + x2) / 2;
    return `<path class="edge ${e.to === current ? "hot" : ""}" d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"/>`;
  }).join("");
  const boxes = nodes.map((n) => {
    const p = pos.get(n.id), color = n.id === current && !TERMINAL.has(n.state) ? cssVar("--amber") : stateColor(n.state);
    const extra = (n.recovered ? " · recovered" : "") + (n.adapted ? " · adapted" : "");
    return `<g class="node ${n.id === current ? "focus" : ""}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <title>${esc(n.label)} · ${esc(n.state)} · ${esc(n.id)}</title>
      <rect class="card" width="${W}" height="${H}" rx="12"/>
      <rect x="0" y="10" width="2" height="${H - 20}" rx="1" fill="${color}"/>
      <text class="t1" x="16" y="22">${esc(clip(n.label, 24))}</text>
      <text class="t2" x="16" y="37">${esc(clip(n.adapter, 16))} · …${esc(n.id.slice(-6))}</text>
      <text class="t3" x="16" y="52" fill="${color}">${esc(n.state)}${esc(extra)}</text>
    </g>`;
  }).join("");
  $("dag").innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Dependency graph of actions">${edges}${boxes}</svg>`;
}

function seam(n, current) {
  const path = n.timeline.length
    ? [{ s: n.timeline[0].from, t: n.created_at }, ...n.timeline.map((t) => ({ s: t.to, t: t.ts, gap: recoveryStep(t), reason: t.reason }))]
    : [{ s: n.state, t: n.created_at }];
  const live = !TERMINAL.has(n.state);
  return `<div class="seam">${path.map((p, i) => {
    const now = live && i === path.length - 1;
    return `<div class="stitch s-${cls(p.s)} ${now ? "now" : ""} ${p.gap ? "gap" : ""}" title="${esc(p.reason || "")}">
      ${p.gap ? `<span class="gapnote">crash</span>` : ""}<i></i><b>${esc(p.s)}</b><time>${esc(stamp(p.t))}</time></div>`;
  }).join("")}</div>`;
}

function renderCards(report, current) {
  $("evCount").textContent = report.nodes.length ? plural(report.nodes.length, "action") : "";
  if (!report.nodes.length) { $("cards").innerHTML = `<div class="empty"><div class="t">No receipts yet.</div></div>`; return; }
  $("cards").innerHTML = report.nodes.map((n) => {
    const rows = n.timeline.map((t) => `<tr>
        <td class="ts mono">${esc(stamp(t.ts))}</td>
        <td><span class="tc s-${cls(t.from)}">${esc(t.from)}</span> <span class="arrow">→</span> <span class="tc s-${cls(t.to)}">${esc(t.to)}</span></td>
        <td class="dt mono">${t.elapsed_ms === null || t.elapsed_ms === undefined ? "" : "+" + esc(t.elapsed_ms) + " ms"}</td>
        <td class="reason">${esc(t.reason)}</td>
      </tr>`).join("");
    const attempts = n.attempts.length ? `<h3>Attempts</h3><table class="timeline">${n.attempts.map((a) => `<tr><td class="ts mono">${esc(stamp(a.ts))}</td><td class="mono" style="color:var(--sage)">${esc(a.worker_id)}</td><td class="reason">${esc(a.outcome)}</td></tr>`).join("")}</table>` : "";
    const problems = n.chain_problems.length ? `<h3>History check</h3><ul class="problems">${n.chain_problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
    return `<article class="evidence ${n.id === current ? "focus" : ""}" id="a-${esc(n.id)}">
      <div class="head">
        <span class="op">${esc(n.label)}</span><span class="adapter mono">${esc(n.adapter)}.${esc(n.operation)}</span>
        ${badge(n.state, n.id === current && !TERMINAL.has(n.state))}
        ${n.recovered ? `<span class="tag">recovered, not re-sent</span>` : ""}
        ${n.adapted ? `<span class="tag adapt">adapted, re-verified</span>` : ""}
        ${n.chain_problems.length ? `<span class="tag bad">history broken</span>` : ""}
        <span class="aid mono">action_id ${esc(n.id)}</span>
      </div>
      ${seam(n, current)}
      <div class="body">
        <div class="colx">
          <h3>State transitions</h3>
          ${rows ? `<table class="timeline"><colgroup><col class="c-ts"><col class="c-move"><col class="c-dt"><col></colgroup>${rows}</table>` : `<div class="none">Planned, not started.</div>`}
          ${attempts}${problems}
        </div>
        <div class="colx">
          <h3>What verify() saw</h3>
          ${hasKeys(n.verify_receipt) ? `<pre class="mono">${pretty(n.verify_receipt)}</pre>` : `<div class="none">${n.state === "verified" ? "Verified at " + esc(stamp(n.verified_at)) + ". Nothing observed was stored." : "Not verified yet."}</div>`}
          ${hasKeys(n.adaptation) ? `<h3>Mapping proposed while unknown</h3><pre class="mono">${pretty(n.adaptation)}</pre>` : ""}
          <h3>External reference</h3>
          ${hasKeys(n.external_ref) ? `<pre class="mono">${pretty(n.external_ref)}</pre>` : `<div class="none">None recorded.</div>`}
          ${hasKeys(n.params) ? `<h3>Parameters</h3><pre class="mono">${pretty(n.params)}</pre>` : ""}
        </div>
      </div>
    </article>`;
  }).join("");
}

async function load() {
  const res = await fetch(`/api/campaigns/${encodeURIComponent(campaignId)}/proof`);
  if (!res.ok) {
    $("verdict").className = "verdict bad";
    $("verdict").innerHTML = `<span class="big">Campaign not found.</span><span class="why mono">${esc(campaignId)}</span>`;
    $("dag").innerHTML = `<div class="empty"><div class="t">Nothing to show.</div></div>`;
    return;
  }
  const report = await res.json();
  const c = report.campaign;
  document.title = `Proof · ${c.playbook || c.kind} · suture`;
  $("title").textContent = `${c.playbook || c.kind} · ${c.state}`;
  $("cid").textContent = `campaign ${c._id}`;
  const current = currentNode(report);
  renderVerdict(report); renderStats(report); renderDag(report, current); renderCards(report, current);
}

$("dag").addEventListener("click", (ev) => {
  const node = ev.target.closest(".node");
  if (!node) return;
  document.querySelectorAll(".evidence.focus, .node.focus").forEach((el) => el.classList.remove("focus"));
  node.classList.add("focus");
  const card = $(`a-${node.dataset.id}`);
  if (!card) return;
  card.classList.add("focus");
  // Scroll only the receipts panel: moving the page would slide the glass off its photo.
  const box = $("cards");
  if (getComputedStyle(box).overflowY === "auto" && box.scrollHeight > box.clientHeight) {
    box.scrollTo({ top: card.offsetTop - box.offsetTop, behavior: "smooth" });
  } else card.scrollIntoView({ behavior: "smooth", block: "start" });
});

// Stay current: reload when the change stream reports a write for this campaign.
let pending = null;
const source = new EventSource("/api/stream");
source.addEventListener("change", (m) => {
  const e = JSON.parse(m.data);
  const mine = e.id === campaignId || (e.doc && e.doc.campaign_id === campaignId);
  if (mine && !pending) pending = setTimeout(() => { pending = null; load(); }, 150);
});
load();
</script>
</body>
</html>
